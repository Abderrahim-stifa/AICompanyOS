name: AICompanyOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AICompanyOS
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python Version
        run: python --version

      - name: Upgrade Pip
        run: python -m pip install --upgrade pip

      - name: Install Requirements
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Check Project Structure
        run: |
          echo "Checking AICompanyOS project structure..."
          test -f app.py
          test -f cli.py
          test -f requirements.txt
          test -d core
          test -d assets
          test -f assets/aicompanyos-logo.svg
          echo "Project structure OK"

      - name: Check Core Files
        run: |
          test -f core/__init__.py
          test -f core/agents.py
          test -f core/ai_agents.py
          test -f core/database.py
          test -f core/settings.py
          test -f core/validator.py
          test -f core/logs.py
          test -f core/backup.py
          test -f core/service.py
          echo "Core files OK"

      - name: Validate Python Files
        run: |
          python -m compileall -q app.py cli.py core tests scripts
          echo "Python syntax validation OK"

      - name: Streamlit Startup Smoke Test
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          process = subprocess.Popen([
              sys.executable, "-m", "streamlit", "run", "app.py",
              "--server.headless", "true", "--server.port", "8501",
              "--browser.gatherUsageStats", "false",
          ], stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
          try:
              deadline = time.time() + 30
              while time.time() < deadline:
                  if process.poll() is not None:
                      raise RuntimeError("Streamlit exited before becoming healthy")
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2) as response:
                          if response.status == 200:
                              print("Streamlit startup smoke test passed")
                              break
                  except (urllib.error.URLError, TimeoutError):
                      time.sleep(1)
              else:
                  raise TimeoutError("Streamlit health endpoint did not become ready")
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait()
          PY

      - name: Capture Authenticated UI Screenshots
        if: matrix.python-version == '3.12'
        env:
          AICOS_DATA_DIR: ${{ runner.temp }}/aicos-screenshot-data
          AICOS_AUTH_USERNAME: screenshot-operator
          AICOS_AUTH_PASSWORD: ci-only-demo-password
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/capture_screenshots.py

      - name: Upload UI Screenshot Artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: aicompanyos-ui-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Run Pytest Service Tests
        run: python -m pytest -q

      - name: Verify Installed Dependencies
        run: python -m pip check

      - name: Publish Refreshed Screenshots to Repository
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are already up to date."
          else
            git commit -m "docs: refresh application screenshots [skip ci]"
            git push
          fi

      - name: Success
        run: |
          echo "=================================="
          echo " AICompanyOS Build Successful"
          echo "=================================="
